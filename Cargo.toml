[package]
name = "git-remote-dev"
version = "1.55.47"
edition = "2021"
description = "SmartNet Git Remote Helper: git clone/push/pull dev://user/repo"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
